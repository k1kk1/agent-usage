name: AgentUsage
options:
  bundleIdPrefix: dev.kikki
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  AgentUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
    dependencies:
      - target: AgentUsageWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kikki.AgentUsage
        PRODUCT_NAME: AgentUsage
        INFOPLIST_KEY_CFBundleDisplayName: Agent Usage
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AgentUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Agent Usage
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kikki.AgentUsage.Widget
        PRODUCT_NAME: AgentUsageWidget
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        # ウィジェット拡張は App Sandbox が有効でないと pluginkit に登録されない。
        ENABLE_APP_SANDBOX: "YES"
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/AgentUsageWidget.entitlements
